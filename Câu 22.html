<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu 22</title>
    <link rel="stylesheet" href="cau22.css">
</head>
<body>
    <div class="calc-box">
        <div class="form-row">
            <label>1st Number :</label>
            <input type="text" id="num1">
        </div>
        <div class="form-row">
            <label>2nd Number:</label>
            <input type="text" id="num2">
        </div>
        <div class="btn-group">
            <button onclick="calc('multiply')">Multiply</button>
            <button onclick="calc('divide')">Divide</button>
        </div>
        <div class="result-box">
            The Result Is :<br>
            <span id="result"></span>
        </div>
    </div>
    <script src="cau22.js"></script>
</body>
</html>
